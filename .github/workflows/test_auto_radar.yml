name: 🔬 Magic_Lab CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  magic-lab-run:
    name: 🚀 Magic_Lab 核心引擎
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢索 Magic_Lab 倉庫代碼
        uses: actions/checkout@v4

      - name: 2. 建立 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安裝 Magic_Lab 必備套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 啟動 Magic_Lab 核心引擎
        run: |
          echo '🔬 Magic_Lab 核心引擎啟動...'
          if [ -f "test_radar.py" ]; then
            python -u test_radar.py
          else
            echo '⚠️ 核心引擎腳本尚未就位，Wesley 待命中...'
          fi

      - name: 5. 自動上傳 Magic_Lab 最新戰報
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Magic_Lab Bot"
          git add terry/ miles/ wayne/ wesley/ --all 2>/dev/null || true
          for file in test_plum_blossom_data.json test_ocean_history.json test_log_report.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔬 Magic_Lab 自動更新：核心引擎掃描完成"
            git push
          fi

  magic-lab-structure:
    name: 🏷️ Magic_Lab 架構驗證
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 驗證四人工作區架構
        run: |
          [ -d terry ] && echo '✅ Terry OK' || (echo '❌ Terry 缺失' && exit 1)
          [ -d miles ] && echo '✅ Miles OK' || (echo '❌ Miles 缺失' && exit 1)
          [ -d wayne ] && echo '✅ Wayne OK' || (echo '❌ Wayne 缺失' && exit 1)
          [ -d wesley ] && echo '✅ Wesley OK' || (echo '❌ Wesley 缺失' && exit 1)
          echo '🏆 Magic_Lab 四人就位！'
