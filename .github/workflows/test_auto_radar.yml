name: Daily Radar Auto-Run

on:
  workflow_dispatch: # 保留手動點擊功能

permissions:
  contents: write # 確保 Action 有權限將資料推回倉庫

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢索倉庫代碼
        uses: actions/checkout@v4

      - name: 2. 建立 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 優化點：開啟 pip 快取，加快後續運行速度

      - name: 3. 安裝雷達必備套件
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests FinMind beautifulsoup4

      - name: 4. 啟動 V9_Test 核心引擎
        run: python -u test_radar.py

      - name: 5. 自動上傳最新戰報 JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          # 安全地將存在的戰報檔案加入暫存區
          for file in test_plum_blossom_data.json test_ocean_history.json test_log_report.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          # 檢查是否有檔案變動，避免無謂的提交報錯
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎡 自動更新：全域戰情室雷達掃描完成"
            git push
          fi
